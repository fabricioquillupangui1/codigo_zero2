<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CÓDIGO ZERO // Acceso y Registro</title>
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-cyber">

  <div class="auth-container">
    <div class="glass-card">
      <div class="brand">
        <h1>CÓDIGO <span>ZERO</span></h1>
        <p class="tagline">Plataforma Interactiva de Evaluación IT</p>
      </div>

      <!-- Pestañas de Alternancia -->
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" data-tab="login" type="button">INICIAR SESIÓN</button>
        <button id="tab-register" class="tab-btn" data-tab="register" type="button">REGISTRARSE</button>
      </div>

      <!-- Contenedor de Alertas / Errores -->
      <div id="auth-alert" class="error-msg" style="display: none;"></div>

      <!-- Formulario de Login -->
      <form id="login-form" class="auth-form" onsubmit="return false;">
        <div class="input-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="dev@codigo-zero.com" required autocomplete="email">
        </div>
        
        <div class="input-group">
          <label for="login-password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="login-password">👁️</button>
          </div>
        </div>

        <button type="submit" class="cyber-btn">ACCEDER AL SISTEMA</button>
      </form>

      <!-- Contenedor de Volver al Inicio (Solo visible en Login) -->
      <div id="back-to-home-container" style="margin-top: 15px; text-align: center;">
        <a href="index.html" style="color: #a855f7; text-decoration: none; font-size: 0.9rem;">← Volver al Inicio</a>
      </div>

      <!-- Formulario de Registro -->
      <form id="register-form" class="auth-form hidden" onsubmit="return false;">
        <div class="input-group">
          <label for="reg-nickname">Nickname Dev</label>
          <input type="text" id="reg-nickname" placeholder="Ej. CyberDev_99" required maxlength="20" autocomplete="nickname">
        </div>

        <div class="input-group">
          <label for="reg-email">Correo Electrónico</label>
          <input type="email" id="reg-email" placeholder="dev@codigo-zero.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="reg-password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="reg-password">👁️</button>
          </div>
        </div>

        <!-- Selector de los 4 Avatares -->
        <div class="avatar-selection">
          <label>Selecciona tu Avatar Dev:</label>
          <div class="avatar-grid">
            
            <!-- Avatar 1: gatito.dev -->
            <div class="avatar-select-card active" data-avatar="gatito.dev">
              <div class="avatar-img-container">
                <img src="https://i.postimg.cc/LXkMsv1V/personaje-dibujos-animados-gatito-ojos-dulces-1308-133051.avif" alt="gatito.dev" class="avatar-img">
              </div>
              <span>gatito.dev</span>
            </div>

            <!-- Avatar 2: panda-cyber -->
            <div class="avatar-select-card" data-avatar="panda-cyber">
              <div class="avatar-img-container">
                <img src="https://i.postimg.cc/JzxdvsKH/pixelcut-export.png" alt="panda-cyber" class="avatar-img">
              </div>
              <span>panda-cyber</span>
            </div>

            <!-- Avatar 3: girl.dev -->
            <div class="avatar-select-card" data-avatar="girl.dev">
              <div class="avatar-img-container">
                <img src="https://i.postimg.cc/HknQWjdM/pixelcut-export-(1).png" alt="girl.dev" class="avatar-img">
              </div>
              <span>girl.dev</span>
            </div>

            <!-- Avatar 4: patito.dev -->
            <div class="avatar-select-card" data-avatar="patito.dev">
              <div class="avatar-img-container">
                <img src="https://i.postimg.cc/C1sW05yy/icono-vectorial-dibujos-animados-ilustracion-naturaleza-animal-icono-aislado-plano-138676-14128.avif" alt="patito.dev" class="avatar-img">
              </div>
              <span>patito.dev</span>
            </div>

          </div>
        </div>

        <button type="submit" class="cyber-btn">REGISTRAR JUGADOR</button>
      </form>
    </div>
  </div>

  <!-- Script para alternar la visibilidad del enlace "Volver al Inicio" según la pestaña -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const backContainer = document.getElementById('back-to-home-container');

      if (tabLogin && tabRegister) {
        tabLogin.addEventListener('click', () => {
          if (backContainer) backContainer.style.display = 'block';
        });

        tabRegister.addEventListener('click', () => {
          if (backContainer) backContainer.style.display = 'none';
        });
      }
    });
  </script>

  <!-- Lógica de Autenticación con Supabase -->
  <script type="module" src="js/auth.js?v=2"></script>

  <!-- Verificación de Sesión Activa -->
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      const activeUser = localStorage.getItem('cz_user');
      if (activeUser) {
        window.location.replace('levels.html');
      }
    });
  </script>
</body>
</html>
